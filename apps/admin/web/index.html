<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    `flutter build web` reemplaza $FLUTTER_BASE_HREF por el valor de
    `--base-href` (por defecto "/"). El panel se sirve desde la raiz.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel de gestión de bouquet.">
  <!-- Un panel privado no se indexa. firebase.json manda ademas el
       encabezado X-Robots-Tag (specs/panel-estructura). -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1a1210">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="bouquet panel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>bouquet — panel</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; background: #f2eadb;">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
