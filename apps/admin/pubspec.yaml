name: admin
description: >
  Panel de administración de bouquet (Flutter, web + Android). Consume el
  SDK cliente de Firebase con las reglas de Firestore aplicándose de verdad
  (ARQUITECTURA.md §1). Fuera del workspace npm: es un proyecto Flutter, no
  un paquete de la monorepo de TypeScript.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '^3.11.1'
  flutter: '>=3.41.4'

dependencies:
  flutter:
    sdk: flutter

  # Estado. ARQUITECTURA — decisiones tomadas: Riverpod, no BLoC ni GetX.
  flutter_riverpod: ^2.6.1

  # Backend. El panel es el único consumidor autenticado del SDK cliente
  # (ARQUITECTURA §1, regla 3).
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.3

  # Rutas que son URLs: en la web se recargan, se comparten y responden al
  # boton de atras (openspec/changes/panel-entrar, design.md §3).
  go_router: ^17.5.0
  flutter_web_plugins:
    sdk: flutter

  # Archivo para la interfaz y las cifras, Newsreader para los nombres
  # (docs/vault/design/tokens.md §5). Se bajan en tiempo de ejecucion.
  google_fonts: ^8.2.1

  # Los textos del sistema (menus, tooltips) en castellano.
  flutter_localizations:
    sdk: flutter

  # Sacar acentos. Dart NO trae normalizacion Unicode en el SDK (no hay
  # String.normalize), asi que el espejo de `packages/contratos/src/texto.ts`
  # -que alla es NFD + sacar las marcas- necesita esto o una tabla de
  # caracteres escrita a mano. La tabla a mano falla en silencio con el
  # caracter que nadie penso; esto no. Que las dos implementaciones den lo
  # mismo lo verifica `test/core/contratos/texto_test.dart` contra las
  # fixtures generadas por el TypeScript.
  diacritic: ^0.1.6

dev_dependencies:
  # package:test y no solo flutter_test: el test del espejo del enum es Dart
  # puro y con esto corre con `dart test`, que SI se puede correr en esta
  # maquina. `flutter test` esta denegado.
  test: ^1.25.15
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
